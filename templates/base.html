<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#075c3b">
  <meta name="description" content="SLSU JGE FindHub - Lost and Found Information System">

  <title>{% block title %}SLSU JGE FindHub{% endblock %}</title>

  <script>
    (() => {
      try {
        const saved = localStorage.getItem("findhub-theme");
        const prefersDark = window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme =
          saved || (prefersDark ? "dark" : "light");
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>

  <style>
    :root {
      color-scheme: light;
      --green: #075c3b;
      --deep: #063f2a;
      --bright: #087647;
      --ink: #24332b;
      --muted: #5c6b61;
      --shadow: 0 5px 18px rgba(0,35,20,.10);
      --shadow-hover: 0 12px 30px rgba(0,45,25,.17);
      --radius: 12px;
      --transition: .25s ease;
      --page-bg: #edf4ee;
      --panel-bg: rgba(255,255,255,.88);
      --panel-border: rgba(255,255,255,.78);
      --field-bg: #fff;
      --field-border: #c8d5cc;
      --table-bg: #fff;
      --table-head: #eaf4ed;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --green: #79d6a5;
      --deep: #0b241a;
      --bright: #38b879;
      --ink: #e6f0e9;
      --muted: #b4c7ba;
      --shadow: 0 5px 18px rgba(0,0,0,.24);
      --shadow-hover: 0 12px 30px rgba(0,0,0,.38);
      --page-bg: #0b1710;
      --panel-bg: rgba(17,34,24,.96);
      --panel-border: rgba(119,190,146,.25);
      --field-bg: #13231a;
      --field-border: #405c49;
      --table-bg: #122219;
      --table-head: #1c3525;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 20px;
      width: 100%;
      overflow-x: clip;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-width: 0;
      display: flex;
      flex-direction: column;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      color: var(--ink);
      background-color: var(--page-bg);
      background-image:
        linear-gradient(135deg, rgba(3,35,23,.25), rgba(3,35,23,.35)),
        url("{{ campus_photo }}");
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
      overflow-wrap: anywhere;
      -webkit-font-smoothing: antialiased;
      transition: background-color var(--transition), color var(--transition);
    }

    html[data-theme="dark"] body {
      background-color: var(--page-bg);
      background-image:
        linear-gradient(135deg, rgba(2,10,5,.84), rgba(2,10,5,.92)),
        url("{{ campus_photo }}");
    }

    img, video, iframe {
      max-width: 100%;
    }

    img {
      height: auto;
    }

    a {
      color: var(--green);
      transition: color var(--transition);
    }

    a:hover {
      color: var(--bright);
    }

    ::selection {
      background: rgba(8,118,71,.20);
      color: var(--deep);
    }

    /* HEADER */
    .site-header {
      position: relative;
      z-index: 100;
      background: rgba(5,55,37,.97);
      color: white;
      padding: 13px 4%;
      box-shadow: 0 4px 18px rgba(0,0,0,.14);
      border-bottom: 1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    html[data-theme="dark"] .site-header {
      background: rgba(3,19,11,.98);
    }

    .header-inner {
      width: 100%;
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .brand img {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      object-fit: contain;
      border-radius: 50%;
      background: white;
      padding: 3px;
      border: 2px solid rgba(255,255,255,.7);
      box-shadow: 0 3px 10px rgba(0,0,0,.15);
    }

    .brand h1 {
      margin: 0 0 3px;
      font-size: 21px;
      line-height: 1.25;
      letter-spacing: .2px;
      color: white;
    }

    .brand p {
      margin: 0;
      font-size: 12px;
      color: rgba(255,255,255,.83);
    }

    /* DESKTOP NAVIGATION */
    .primary-navigation {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 7px;
    }

    .primary-navigation a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 12px;
      padding: 8px 11px;
      border: 1px solid rgba(255,255,255,.30);
      border-radius: 8px;
      background: rgba(255,255,255,.045);
      transition: background-color var(--transition),
        color var(--transition), border-color var(--transition),
        transform var(--transition);
    }

    .primary-navigation a:hover {
      background: white;
      color: #075c3b;
      border-color: white;
      transform: translateY(-1px);
    }

    /* MOBILE HAMBURGER */
    .menu-toggle {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 46px;
      min-height: 44px;
      padding: 9px 12px;
      border: 1px solid rgba(255,255,255,.45);
      border-radius: 9px;
      background: rgba(255,255,255,.10);
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .menu-toggle:hover {
      background: rgba(255,255,255,.20);
    }

    .menu-icon {
      display: inline-flex;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      width: 20px;
    }

    .menu-icon span {
      display: block;
      height: 2px;
      width: 20px;
      border-radius: 2px;
      background: currentColor;
      transition: transform .2s ease, opacity .2s ease;
    }

    .menu-toggle[aria-expanded="true"] .menu-icon span:first-child {
      transform: translateY(7px) rotate(45deg);
    }

    .menu-toggle[aria-expanded="true"] .menu-icon span:nth-child(2) {
      opacity: 0;
    }

    .menu-toggle[aria-expanded="true"] .menu-icon span:last-child {
      transform: translateY(-7px) rotate(-45deg);
    }

    #theme-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 40px;
      padding: 8px 11px;
      border: 1px solid rgba(255,255,255,.55);
      border-radius: 8px;
      background: white;
      color: #075c3b;
      font-family: inherit;
      font-size: 12px;
      font-weight: bold;
      line-height: 1.35;
      cursor: pointer;
      white-space: nowrap;
    }

    html[data-theme="dark"] #theme-toggle {
      background: #d9f4e3;
      color: #063f2a;
      border-color: #79d6a5;
    }

    /* MAIN LAYOUT */
    .container {
      width: 92%;
      max-width: 1050px;
      min-width: 0;
      margin: 18px auto 26px;
    }

    main.container {
      flex: 1;
    }

    .hero {
      width: 92%;
      max-width: 1050px;
      margin: 20px auto 16px;
      padding: 25px 20px;
      text-align: center;
      background: var(--panel-bg) !important;
      color: var(--ink);
      border: 1px solid var(--panel-border);
      border-radius: 15px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
    }

    .hero h2 {
      color: var(--green);
      font-size: clamp(24px, 3vw, 33px);
      line-height: 1.2;
      margin: 0 0 10px;
    }

    .hero p {
      max-width: 650px;
      line-height: 1.65;
      margin: 0 auto 16px;
      font-size: 14px;
    }
        .panel, .card, .form-container, .form-box, .auth-card,
    .login-box, .register-box, .content-box, .table-container {
      min-width: 0;
      max-width: 100%;
      padding: 16px;
      margin-bottom: 15px;
      background: var(--panel-bg) !important;
      color: var(--ink);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    /* BUTTONS */
    .button, a.button, button:not(#theme-toggle):not(.menu-toggle),
    input[type="submit"], input[type="button"], input[type="reset"] {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 42px;
      max-width: 100%;
      padding: 10px 14px;
      border: 1px solid #075c3b;
      border-radius: 8px;
      background: #087647;
      color: white;
      font-family: inherit;
      font-size: 13px;
      font-weight: bold;
      line-height: 1.35;
      text-decoration: none;
      cursor: pointer;
      overflow-wrap: anywhere;
    }

    .button:hover, a.button:hover,
    button:not(#theme-toggle):not(.menu-toggle):hover,
    input[type="submit"]:hover, input[type="button"]:hover {
      background: #063f2a;
      border-color: #063f2a;
      color: white;
    }

    .secondary, .button.secondary, button.secondary {
      background: #66766c !important;
      border-color: #56665c !important;
      color: white !important;
    }

    .danger, .button.danger, button.danger {
      background: #b42332 !important;
      border-color: #941d29 !important;
      color: white !important;
    }

    button:disabled, input:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    /* CATEGORY STICKERS */
    .sticker-row {
      display: flex;
      justify-content: center;
      gap: 9px;
      flex-wrap: wrap;
      margin: 0 0 14px;
    }

    .sticker {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 11px;
      border-radius: 999px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      box-shadow: 0 2px 5px rgba(0,0,0,.05);
      font-weight: bold;
      font-size: 12px;
      color: var(--green);
    }

    .sticker span {
      font-size: 16px;
    }

    /* FLASH MESSAGES */
    .flash {
      border-radius: 9px;
      padding: 11px 13px;
      margin: 0 0 11px;
      background: #d8f3df;
      color: #155c2e;
      border: 1px solid rgba(25,135,84,.12);
      border-left: 4px solid #198754;
      font-size: 13px;
    }

    .flash.warning {
      background: #fff0c2;
      color: #795500;
      border-left-color: #d49b00;
    }

    .flash.danger, .flash.error {
      background: #f8d7da;
      color: #842029;
      border-left-color: #b42332;
    }

    html[data-theme="dark"] .flash:not(.warning):not(.danger):not(.error) {
      background: #173b27;
      color: #c9f5d7;
    }

    html[data-theme="dark"] .flash.warning {
      background: #403619;
      color: #ffe6a0;
    }

    html[data-theme="dark"] .flash.danger,
    html[data-theme="dark"] .flash.error {
      background: #481f25;
      color: #ffd1d5;
    }

    /* FORMS */
    h2, h3 {
      color: var(--green);
    }

    h2 {
      font-size: 22px;
      line-height: 1.3;
    }

    h3 {
      font-size: 17px;
      line-height: 1.35;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 11px 0 5px;
      font-size: 13px;
      color: var(--ink);
    }

    input, select, textarea {
      width: 100%;
      min-width: 0;
      max-width: 100%;
      min-height: 42px;
      padding: 10px;
      border: 1px solid var(--field-border);
      border-radius: 8px;
      font: inherit;
      font-size: 14px;
      background: var(--field-bg);
      color: var(--ink);
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--bright);
      box-shadow: 0 0 0 3px rgba(8,118,71,.13);
      outline: none;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    input[type="checkbox"], input[type="radio"] {
      width: auto;
      min-height: auto;
      accent-color: var(--bright);
    }

    input[type="file"] {
      padding: 8px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0 14px;
    }

    .full {
      grid-column: 1 / -1;
    }

    .help {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    /* SEARCH FILTERS */
    .filter-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 9px;
      align-items: end;
    }

    /* STATISTICS */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 11px;
      margin-bottom: 17px;
    }

    .stat {
      min-width: 0;
      min-height: 88px;
      padding: 14px;
      border-radius: 12px;
      background: var(--panel-bg) !important;
      border: 1px solid var(--panel-border);
      box-shadow: var(--shadow);
      color: var(--ink);
      font-size: 13px;
    }

    .stat strong {
      display: block;
      color: var(--green);
      font-size: 23px;
      line-height: 1.2;
      margin-top: 5px;
    }

    /* REPORT CARDS */
    .report-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      align-items: stretch;
    }

    .report-card {
      min-width: 0;
      height: 100%;
      overflow: hidden;
      border-radius: 12px;
      background: var(--panel-bg) !important;
      color: var(--ink);
      border: 1px solid var(--panel-border);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }

    .report-photo, .placeholder-photo {
      width: 100%;
      height: 145px;
      flex-shrink: 0;
      object-fit: cover;
      background: var(--panel-bg);
    }

    .report-photo, .detail-photo {
      cursor: zoom-in;
    }

    .placeholder-photo {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 42px;
      color: var(--muted);
    }

    .report-content {
      padding: 13px;
      display: flex;
      flex-direction: column;
      flex: 1;
      background: transparent !important;
      color: var(--ink);
    }

    .report-content h3 {
      margin: 8px 0;
      font-size: 17px;
      overflow-wrap: anywhere;
    }

    .report-content p {
      font-size: 13px;
      line-height: 1.55;
      margin: 4px 0;
      overflow-wrap: anywhere;
    }

    .tag {
      display: inline-flex;
      align-self: flex-start;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: bold;
      background: #d8f3df;
      color: #075c3b;
    }

    .tag.lost {
      background: #fff0c2;
      color: #795500;
    }

    .tag.found {
      background: #d8f3df;
      color: #075c3b;
    }

    .tag.claimed, .tag.resolved {
      background: #dbeafe;
      color: #1e40af;
    }

    .report-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: auto;
      padding-top: 12px;
    }

    /* DETAILS */
    .detail-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .detail-photo {
      display: block;
      width: 100%;
      max-height: 450px;
      object-fit: contain;
      border-radius: 10px;
      background: rgba(0,0,0,.04);
    }

    .detail-image-wrap {
      min-width: 0;
      padding: 10px;
      border-radius: 12px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
    }

    /* TABLES */
    .table-container {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--table-bg);
      color: var(--ink);
      font-size: 13px;
    }

    th, td {
      padding: 10px;
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid var(--field-border);
      overflow-wrap: anywhere;
    }

    th {
      background: var(--table-head);
      color: var(--green);
      font-weight: bold;
    }

    tbody tr:hover {
      background: rgba(8,118,71,.045);
    }

    /* NOTIFICATIONS */
    .notification-item {
      padding: 13px;
      margin-bottom: 10px;
      border-radius: 10px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      box-shadow: var(--shadow);
    }

    .notification-item.unread {
      border-left: 4px solid var(--bright);
    }

    .notification-item p {
      margin: 5px 0;
    }

    .notification-time {
      font-size: 12px;
      color: var(--muted);
    }

    /* FOOTER */
    .site-footer {
      margin-top: auto;
      padding: 18px 4%;
      text-align: center;
      background: rgba(5,55,37,.97);
      color: white;
      font-size: 12px;
    }

    .site-footer p {
      margin: 4px 0;
    }

    /* MODAL */
    .image-modal {
      display: none;
      position: fixed;
      z-index: 9999;
      inset: 0;
      padding: 24px;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.88);
    }

    .image-modal.open {
      display: flex;
    }

    .image-modal img {
      display: block;
      max-width: 95vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 8px;
    }

    .image-modal-close {
      position: absolute;
      top: 12px;
      right: 18px;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: white;
      color: #111;
      font-size: 28px;
      cursor: pointer;
    }

    /* RESPONSIVE */
    @media (max-width: 900px) {
      .header-inner {
        flex-wrap: wrap;
      }

      .brand {
        flex: 1;
      }

      .menu-toggle {
        display: inline-flex;
      }

      .primary-navigation {
        display: none;
        width: 100%;
        padding-top: 12px;
        justify-content: stretch;
        align-items: stretch;
        flex-direction: column;
      }

      .primary-navigation.open {
        display: flex;
      }

      .primary-navigation a,
      .primary-navigation #theme-toggle {
        width: 100%;
        justify-content: flex-start;
        text-align: left;
      }

      .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .report-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .filter-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 600px) {
      body {
        background-attachment: scroll;
      }

      .site-header {
        padding: 10px 4%;
      }

      .brand img {
        width: 40px;
        height: 40px;
      }

      .brand h1 {
        font-size: 17px;
      }

      .brand p {
        font-size: 10px;
      }

      .container, .hero {
        width: 94%;
      }

      .hero {
        margin-top: 14px;
        padding: 20px 14px;
      }

      .hero h2 {
        font-size: 24px;
      }

      .panel, .card, .form-container, .form-box, .auth-card,
      .login-box, .register-box, .content-box, .table-container {
        padding: 12px;
      }

      .report-grid {
        grid-template-columns: minmax(0, 1fr);
      }

      .detail-layout {
        grid-template-columns: minmax(0, 1fr);
      }

      .form-grid, .filter-grid {
        grid-template-columns: minmax(0, 1fr);
      }

      .stats {
        gap: 8px;
      }

      .stat {
        padding: 11px;
        min-height: 78px;
      }

      .stat strong {
        font-size: 20px;
      }

      .image-modal {
        padding: 12px;
      }

      .image-modal-close {
        top: 8px;
        right: 8px;
      }
    }
  </style>
