
<style>
    :root {
        --fh-green: #075c3b;
        --fh-green-dark: #043d28;
        --fh-surface: rgba(255, 255, 255, 0.93);
        --fh-radius: 15px;
        --fh-shadow: 0 8px 24px rgba(0, 0, 0, 0.13);
    }

    * {
        box-sizing: border-box;
    }

    html {
        min-height: 100%;
        scroll-behavior: smooth;
    }

    body {
        min-height: 100vh;
        margin: 0;
        color: #18382b;
        background: linear-gradient(
            rgba(5, 42, 28, 0.42),
            rgba(5, 42, 28, 0.42)
        ), url("/static/images/campus-bg.jpg") center / cover fixed no-repeat;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        line-height: 1.6;
    }

    /* HEADER */

    .site-header {
        position: sticky;
        top: 0;
        z-index: 100;
        color: #fff;
        background: rgba(5, 82, 52, 0.97);
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.16);
        backdrop-filter: blur(12px);
    }

    .header-inner {
        width: min(1200px, calc(100% - 40px));
        min-height: 72px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
        color: #fff;
        text-decoration: none;
    }

    .brand-logo,
    .brand-mark {
        width: 46px;
        height: 46px;
        flex: 0 0 46px;
        object-fit: contain;
        border-radius: 50%;
        background: #fff;
        padding: 3px;
    }

    .brand-mark {
        display: grid;
        place-items: center;
        color: var(--fh-green);
        font-weight: 800;
    }

    .brand-copy {
        display: flex;
        flex-direction: column;
        line-height: 1.3;
    }

    .brand-copy strong {
        font-size: 16px;
    }

    .brand-copy small {
        margin-top: 3px;
        color: #d9f0e2;
        font-size: 12px;
    }

    .primary-navigation {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 6px;
    }

    .primary-navigation a,
    .theme-toggle {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 9px 12px;
        border: 0;
        border-radius: 9px;
        color: #fff;
        background: transparent;
        font: inherit;
        font-size: 14px;
        text-decoration: none;
        cursor: pointer;
    }

    .primary-navigation a:hover,
    .theme-toggle:hover {
        color: #fff;
        background: rgba(255, 255, 255, 0.15);
    }

    .nav-count {
        display: inline-grid;
        place-items: center;
        min-width: 20px;
        height: 20px;
        padding: 0 5px;
        border-radius: 20px;
        color: #fff;
        background: #c83232;
        font-size: 11px;
    }

    .menu-toggle {
        display: none;
        width: 42px;
        height: 42px;
        padding: 8px;
        border: 1px solid rgba(255,255,255,.35);
        border-radius: 9px;
        background: transparent;
        cursor: pointer;
    }

    .menu-toggle span {
        display: block;
        height: 2px;
        margin: 5px 0;
        background: #fff;
    }

    /* MAIN CONTAINER
       Keep all page sections aligned and away from screen edges. */

    .page-container {
        width: min(1000px, calc(100% - 40px));
        min-width: 0;
        min-height: 55vh;
        margin: 28px auto 44px;
    }

    /* HOME HERO: avoid full-screen, edge-to-edge panel */

    .hero,
    .home-hero,
    .hero-section {
        width: min(1000px, calc(100% - 40px));
        margin: 24px auto;
        padding: clamp(20px, 3vw, 32px);
        border: 1px solid rgba(255,255,255,.7);
        border-radius: var(--fh-radius);
        background: var(--fh-surface);
        box-shadow: var(--fh-shadow);
        backdrop-filter: blur(9px);
    }

    /* Cards share consistent sizing */

    .page-container .card,
    .page-container .panel,
    .page-container .stat-card,
    .page-container .report-card,
    .page-container .form-card,
    .page-container .dashboard-card,
    .page-container .search-panel,
    .page-container .empty-state,
    .page-container .home-stats,
    .page-container .stat {
        min-width: 0;
        color: #18382b;
        background: var(--fh-surface);
        border: 1px solid rgba(255,255,255,.7);
        border-radius: var(--fh-radius);
        box-shadow: var(--fh-shadow);
        backdrop-filter: blur(9px);
    }

    .page-container .card,
    .page-container .panel,
    .page-container .form-card,
    .page-container .dashboard-card,
    .page-container .search-panel {
        padding: clamp(16px, 2.5vw, 24px);
    }

    .page-container .stat-card {
        padding: 18px;
    }

    .page-container .report-card {
        overflow: hidden;
    }

    .page-container .report-card img {
        display: block;
        width: 100%;
        height: auto;
        object-fit: cover;
    }

    /* Keep grids within their parent */

    .card-grid,
    .reports-grid,
    .stats-grid,
    .dashboard-grid,
    .report-grid {
        display: grid;
        grid-template-columns: repeat( auto-fit, minmax(min(100%, 220px), 1fr) );
        gap: 16px;
        min-width: 0;
    }

    /* BUTTONS */

    .page-container .btn,
    .page-container .button,
    .page-container button,
    .page-container input[type="submit"] {
        border-radius: 9px;
    }

    .page-container .btn-primary,
    .page-container .btn-success,
    .page-container .button-primary,
    .page-container input[type="submit"] {
        color: #fff;
        background: var(--fh-green);
        border-color: var(--fh-green);
    }

    .page-container .btn-primary:hover,
    .page-container .btn-success:hover,
    .page-container .button-primary:hover,
    .page-container input[type="submit"]:hover {
        color: #fff;
        background: var(--fh-green-dark);
    }

    /* FORMS */

    .page-container form {
        max-width: 100%;
    }

    .page-container input:not([type="checkbox"]):not([type="radio"]):not([type="file"]):not([type="submit"]),
    .page-container select,
    .page-container textarea {
        width: 100%;
        max-width: 100%;
        min-height: 42px;
        padding: 10px 12px;
        border: 1px solid #d7e3da;
        border-radius: 9px;
        background: #fff;
        color: #18382b;
        font: inherit;
    }

    .page-container textarea {
        min-height: 110px;
        resize: vertical;
    }

    .page-container input[type="file"] {
        max-width: 100%;
    }

    /* TABLES */

    .table-wrap {
        max-width: 100%;
        overflow-x: auto;
        border: 1px solid #d7e3da;
        border-radius: 12px;
        background: var(--fh-surface);
    }

    .table-wrap table {
        width: 100%;
        border-collapse: collapse;
    }

    .page-container table {
        max-width: 100%;
        border-collapse: collapse;
    }

    .page-container th,
    .page-container td {
        padding: 11px 12px;
        border-bottom: 1px solid #d7e3da;
        text-align: left;
        vertical-align: top;
    }

    /* FLASH MESSAGES */

    .flash-stack {
        width: min(1000px, calc(100% - 40px));
        margin: 16px auto;
    }

    .flash-message {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 10px;
        padding: 12px 15px;
        border-radius: 10px;
        background: #fff;
        box-shadow: 0 4px 15px rgba(0,0,0,.1);
    }

    .flash-message.success { border-left: 5px solid #198754; }
    .flash-message.error { border-left: 5px solid #dc3545; }
    .flash-message.warning { border-left: 5px solid #e5a000; }
    .flash-message.info { border-left: 5px solid #0d6efd; }

    .flash-dismiss {
        border: 0;
        background: transparent;
        color: #555;
        font-size: 23px;
        cursor: pointer;
    }

    /* FOOTER */

    .site-footer {
        margin-top: 40px;
        padding: 24px 0;
        color: #fff;
        background: rgba(4,54,35,.96);
        text-align: center;
    }

    .footer-inner {
        width: min(1000px, calc(100% - 40px));
        margin: 0 auto;
    }

    .footer-inner p {
        margin: 6px 0;
    }

    /* IMAGE MODAL */

    .image-modal[hidden] { display: none !important; }

    .image-modal {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: rgba(0,0,0,.88);
    }

    .image-modal img {
        max-width: 95%;
        max-height: 85vh;
        object-fit: contain;
    }

    .image-modal-close {
        position: absolute;
        top: 20px;
        right: 25px;
        border: 0;
        color: #fff;
        background: transparent;
        font-size: 36px;
        cursor: pointer;
    }

    /* DARK MODE */

    html[data-theme="dark"] body {
        color: #e6f2eb;
        background-color: #10271d;
        background-image:
            linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,.65)),
            url("/static/images/campus-bg.jpg");
    }

    html[data-theme="dark"] .page-container .card,
    html[data-theme="dark"] .page-container .panel,
    html[data-theme="dark"] .page-container .stat-card,
    html[data-theme="dark"] .page-container .report-card,
    html[data-theme="dark"] .page-container .form-card,
    html[data-theme="dark"] .page-container .dashboard-card,
    html[data-theme="dark"] .page-container .search-panel,
    html[data-theme="dark"] .page-container .empty-state,
    html[data-theme="dark"] .page-container .home-stats,
    html[data-theme="dark"] .page-container .stat {
        color: #edf7f0;
        background: rgba(20,38,29,.94);
        border-color: rgba(255,255,255,.12);
    }

    html[data-theme="dark"] .page-container input,
    html[data-theme="dark"] .page-container textarea,
    html[data-theme="dark"] .page-container select {
        color: #f4fff7;
        background: #1c3528;
        border-color: #486654;
    }

    html[data-theme="dark"] .site-footer {
        background: rgba(5,24,16,.97);
    }

    /* RESPONSIVE */

    @media (max-width: 900px) {
        .header-inner {
            width: calc(100% - 28px);
            min-height: 68px;
            flex-wrap: wrap;
            padding: 8px 0;
        }

        .menu-toggle {
            display: block;
        }

        .primary-navigation {
            display: none;
            width: 100%;
            align-items: stretch;
            flex-direction: column;
            padding: 0 0 12px;
        }

        .primary-navigation.is-open {
            display: flex;
        }

        .primary-navigation a,
        .theme-toggle {
            width: 100%;
            box-sizing: border-box;
            justify-content: flex-start;
        }
    }

    @media (max-width: 600px) {
        body {
            background-attachment: scroll;
        }

        .page-container,
        .hero,
        .home-hero,
        .hero-section {
            width: calc(100% - 24px);
        }

        .page-container {
            margin-top: 18px;
            margin-bottom: 28px;
        }

        .card-grid,
        .reports-grid,
        .stats-grid,
        .dashboard-grid,
        .report-grid {
            grid-template-columns: 1fr;
        }

        .footer-inner {
            width: calc(100% - 24px);
        }
    }
</style>
