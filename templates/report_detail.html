    docume{% extends "base.html" %}

{% block title %}{{ report.item_name }} Details | SLSU JGE FindHub{% endblock %}

{% block head %}
<style>
  .tab-btn.active {
    border-bottom: 2px solid #2563eb;
    color: #2563eb;
    font-weight: 600;
  }
</style>
{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <!-- Top Navigation & Back Button -->
  <div class="mb-6 flex items-center justify-between">
    <a href="{{ url_for('home', view='reports') }}" class="inline-flex items-center text-sm text-gray-600 hover:text-gray-900 transition-colors">
      <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
      </svg>
      Back to Reports
    </a>
    <div class="flex items-center space-x-2">
      <span class="px-3 py-1 text-xs font-semibold rounded-full 
        {% if report.report_type|lower == 'lost' %} bg-red-100 text-red-800 {% else %} bg-green-100 text-green-800 {% endif %}">
        {{ report.report_type|capitalize }}
      </span>
      <span class="px-3 py-1 text-xs font-semibold rounded-full bg-blue-100 text-blue-800">
        {{ report.status or 'Open' }}
      </span>
    </div>
  </div>

  <!-- Main Grid Layout (2-Column structure for compact viewing) -->
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
    
    <!-- LEFT COLUMN: Item Photo & Summary Card (4 Columns) -->
    <div class="lg:col-span-4 space-y-6">
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <!-- Photo Container -->
        <div class="w-full h-64 bg-gray-100 flex items-center justify-center overflow-hidden relative">
          {% if report.photo %}
            <img src="{{ report.photo }}" alt="{{ report.item_name }}" class="w-full h-full object-cover">
          {% else %}
            <div class="text-center p-6 text-gray-400">
              <svg class="w-16 h-16 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
              </svg>
              <span>No image provided</span>
            </div>
          {% endif %}
        </div>

        <!-- Essential Quick Details -->
        <div class="p-5 space-y-4">
          <h1 class="text-2xl font-bold text-gray-900">{{ report.item_name }}</h1>
          
          <div class="space-y-2 text-sm text-gray-600">
            <div class="flex items-center">
              <svg class="w-4 h-4 mr-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
              </svg>
              <span>{{ report.location or 'Location not specified' }}</span>
            </div>
            <div class="flex items-center">
              <svg class="w-4 h-4 mr-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
              </svg>
              <span>{{ report.incident_date or 'Date not specified' }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT COLUMN: Tabbed Content Area (8 Columns) -->
    <div class="lg:col-span-8">
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        
        <!-- Navigation Tabs Header -->
        <div class="border-b border-gray-200 bg-gray-50/50 px-6 pt-4">
          <nav class="flex space-x-8" aria-label="Tabs" id="reportTabs">
            <button onclick="switchTab('info')" id="tab-info" class="tab-btn active pb-4 px-1 text-sm font-medium text-gray-700 hover:text-blue-600 focus:outline-none">
              Report Information
            </button>
            <button onclick="switchTab('provide')" id="tab-provide" class="tab-btn pb-4 px-1 text-sm font-medium text-gray-500 hover:text-blue-600 focus:outline-none">
              Provide Information / Claim
            </button>
            <button onclick="switchTab('claims')" id="tab-claims" class="tab-btn pb-4 px-1 text-sm font-medium text-gray-500 hover:text-blue-600 focus:outline-none flex items-center">
              Submitted Claims
              {% if claims %}
                <span class="ml-2 bg-blue-100 text-blue-600 py-0.5 px-2 rounded-full text-xs font-semibold">
                  {{ claims|length }}
                </span>
              {% endif %}
            </button>
          </nav>
        </div>

        <!-- Tab Contents Area -->
        <div class="p-6">
          
          <!-- TAB 1: Report Information -->
          <div id="content-info" class="tab-content space-y-6">
            <div>
              <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Item Description</h3>
              <p class="text-gray-700 text-sm leading-relaxed whitespace-pre-line bg-gray-50 p-4 rounded-lg border border-gray-100">
                {{ report.description or 'No detailed description provided.' }}
              </p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
              <div class="border border-gray-100 rounded-lg p-4 bg-gray-50/50">
                <span class="block text-xs font-semibold text-gray-400 uppercase">Reported By</span>
                <span class="text-sm font-medium text-gray-800">{{ report.reporter_name or 'Anonymous Student/Staff' }}</span>
              </div>
              <div class="border border-gray-100 rounded-lg p-4 bg-gray-50/50">
                <span class="block text-xs font-semibold text-gray-400 uppercase">Date Posted</span>
                <span class="text-sm font-medium text-gray-800">{{ report.created_at or 'Recently' }}</span>
              </div>
            </div>
          </div>

          <!-- TAB 2: Provide Information About This Item -->
          <div id="content-provide" class="tab-content hidden">
            <div class="mb-4">
              <h3 class="text-lg font-semibold text-gray-900">Have information or claiming this item?</h3>
              <p class="text-xs text-gray-500">Fill out the form below to connect with the reporter securely.</p>
            </div>

            <form action="{{ url_for('submit_claim', report_id=report.id) if url_for else '#' }}" method="POST" class="space-y-4">
              <div>
                <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Your Relationship</label>
                <select name="claim_type" class="w-full text-sm rounded-lg border-gray-300 focus:border-blue-500 focus:ring-blue-500">
                  <option value="owner">I am the owner of this item</option>
                  <option value="finder">I found this item</option>
                  <option value="info">I have helpful information</option>
                </select>
              </div>

              <div>
                <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Details / Proof of Ownership</label>
                <textarea name="details" rows="4" class="w-full text-sm rounded-lg border-gray-300 focus:border-blue-500 focus:ring-blue-500" placeholder="Provide details such as unique marks, contents, or where it was last seen..."></textarea>
              </div>

              <div>
                <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Contact Details</label>
                <input type="text" name="contact" class="w-full text-sm rounded-lg border-gray-300 focus:border-blue-500 focus:ring-blue-500" placeholder="Email or Phone Number">
              </div>

              <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-lg text-sm transition-colors shadow-sm">
                Submit Claim Information
              </button>
            </form>
          </div>

          <!-- TAB 3: Submitted Claims -->
          <div id="content-claims" class="tab-content hidden">
            {% if claims %}
              <div class="space-y-4">
                {% for claim in claims %}
                  <div class="p-4 rounded-lg border border-gray-100 bg-gray-50 hover:bg-white transition-colors">
                    <div class="flex items-center justify-between mb-2">
                      <span class="font-semibold text-sm text-gray-900">{{ claim.submitter_name or 'Anonymous User' }}</span>
                      <span class="text-xs px-2.5 py-0.5 rounded-full bg-yellow-100 text-yellow-800 font-medium">
                        {{ claim.status or 'Pending Review' }}
                      </span>
                    </div>
                    <p class="text-sm text-gray-600 mb-2">{{ claim.details }}</p>
                    <span class="text-xs text-gray-400 block">{{ claim.submitted_at or 'Recently submitted' }}</span>
                  </div>
                {% endfor %}
              </div>
            {% else %}
              <div class="text-center py-8">
                <svg class="w-12 h-12 mx-auto text-gray-300 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                </svg>
                <p class="text-gray-500 text-sm">No claims or responses submitted yet.</p>
              </div>
            {% endif %}
          </div>

        </div>
      </div>
    </div>

  </div>
</div>nt.querySelectorAll('.tab-btn').forEach(btn => {
      btn.classList.remove('active');
      btn.classList.add('text-gray-500');
    });

    // Show selected content and activate tab
    document.getElementById('content-' + tabName).classList.remove('hidden');
    const activeTab = document.getElementById('tab-' + tabName);
    activeTab.classList.add('active');
    activeTab.classList.remove('text-gray-500');
  }
</script>
{% endblock %}
