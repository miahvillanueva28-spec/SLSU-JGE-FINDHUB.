{% extends "base.html" %}
{% block title %}
  {% if request.args.get('view') == 'reports' %}All Reports | {% endif %}Home | SLSU JGE FindHub
{% endblock %}
{% block head %}
<style>
  /* ==============================================
     HOME HERO — ENHANCED
  ============================================== */
  .home-hero {
    position: relative;
    overflow: hidden;
    padding: clamp(40px, 6vw, 72px);
    border: 1px solid var(--border);
    border-radius: 24px;
    background: var(--surface);
    box-shadow: var(--shadow);
    text-align: center;
  }
  .home-hero .sticker-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-bottom: 28px;
  }
  .home-hero .sticker {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface-alt);
    color: var(--text);
    font-size: 13px;
    font-weight: 700;
    animation: homeStickerEnter .5s cubic-bezier(.22,1,.36,1) both;
    transition: transform .25s ease, box-shadow .25s ease, background .25s ease;
  }
  .home-hero .sticker:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(0,0,0,.08);
    background: var(--primary-soft);
  }
  .home-hero .sticker:nth-child(2) { animation-delay: .08s; }
  .home-hero .sticker:nth-child(3) { animation-delay: .16s; }
  .home-hero .sticker:nth-child(4) { animation-delay: .24s; }
  .home-hero h1 {
    max-width: 800px;
    margin: 0 auto 12px;
    color: var(--primary);
    font-size: clamp(34px, 6vw, 56px);
    line-height: 1.08;
    letter-spacing: -.8px;
    font-weight: 800;
    animation: heroFadeUp .7s cubic-bezier(.22,1,.36,1) .1s both;
  }
  .home-hero .tagline {
    max-width: 650px;
    margin: 0 auto 14px;
    color: var(--text);
    font-size: clamp(18px, 3vw, 24px);
    font-weight: 600;
    animation: heroFadeUp .7s cubic-bezier(.22,1,.36,1) .2s both;
  }
  .home-hero .hero-description {
    max-width: 680px;
    margin: 0 auto 24px;
    color: var(--muted);
    font-size: clamp(15px, 2vw, 17px);
    line-height: 1.8;
    animation: heroFadeUp .7s cubic-bezier(.22,1,.36,1) .3s both;
  }

  /* ✅ HOW IT WORKS SECTION */
  .how-it-works {
    max-width: 800px;
    margin: 0 auto 32px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    animation: heroFadeUp .7s cubic-bezier(.22,1,.36,1) .35s both;
  }
  .step-card {
    padding: 16px 12px;
    border-radius: 14px;
    background: var(--primary-soft);
    border: 1px solid rgba(7,92,59,0.1);
    transition: transform .3s ease, box-shadow .3s ease;
  }
  .step-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(7,92,59,0.12);
  }
  .step-number {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--primary);
    color: white;
    font-weight: 800;
    font-size: 14px;
    margin-bottom: 8px;
  }
  .step-card h4 {
    margin: 0 0 4px;
    font-size: 14px;
    font-weight: 700;
    color: var(--primary);
  }
  .step-card p {
    margin: 0;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
  }
  @media (max-width: 600px) {
    .how-it-works {
      grid-template-columns: 1fr;
      gap: 10px;
    }
  }

  .home-hero .button-group {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    justify-content: center;
    animation: heroFadeUp .7s cubic-bezier(.22,1,.36,1) .4s both;
  }
  .home-hero .button {
    box-shadow: 0 5px 13px rgba(0, 75, 43, .16);
    min-width: 210px;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .home-hero .button::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    border-radius: 50%;
    background: rgba(255,255,255,.25);
    transform: translate(-50%, -50%);
    transition: width .5s ease, height .5s ease;
  }
  .home-hero .button:active::after {
    width: 300px;
    height: 300px;
  }
  .home-hero .button:hover {
    box-shadow: 0 10px 24px rgba(0, 75, 43, .28);
    transform: translateY(-3px);
  }
  .button.lost-btn {
    background: #fff3e0;
    color: #e65100;
    border-color: #ffcc80;
  }
  .button.lost-btn:hover {
    background: #ffe0b2;
    color: #e65100;
    border-color: #ffb74d;
  }
  .button.found-btn {
    background: #e8f5e9;
    color: #2e7d32;
    border-color: #a5d6a7;
  }
  .button.found-btn:hover {
    background: #c8e6c9;
    color: #2e7d32;
    border-color: #81c784;
  }
  html[data-theme="dark"] .button.lost-btn {
    background: #5d3a14;
    color: #ffcc80;
    border-color: #8d551a;
  }
  html[data-theme="dark"] .button.lost-btn:hover {
    background: #7a4a1a;
    color: #ffe0b2;
  }
  html[data-theme="dark"] .button.found-btn {
    background: #1e4620;
    color: #a5d6a7;
    border-color: #2e7d32;
  }
  html[data-theme="dark"] .button.found-btn:hover {
    background: #265c28;
    color: #c8e6c9;
  }

  /* ==============================================
     STATISTICS — ENHANCED WITH COUNTER ANIMATION
  ============================================== */
  .home-stats {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 18px;
    margin: 28px 0;
  }
  .home-stats .stat {
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 26px 20px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: var(--surface);
    box-shadow: var(--shadow);
    text-align: center;
    transition: transform .3s cubic-bezier(.22,1,.36,1), box-shadow .3s ease;
    opacity: 0;
    transform: translateY(20px);
  }
  .home-stats .stat.visible {
    opacity: 1;
    transform: translateY(0);
    transition: opacity .6s ease, transform .6s cubic-bezier(.22,1,.36,1);
  }
  .home-stats .stat:nth-child(1).visible { transition-delay: .05s; }
  .home-stats .stat:nth-child(2).visible { transition-delay: .15s; }
  .home-stats .stat:nth-child(3).visible { transition-delay: .25s; }
  .home-stats .stat:nth-child(4).visible { transition-delay: .35s; }
  .home-stats .stat:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 28px rgba(0,0,0,.1);
  }
  .home-stats .stat::before {
    content: "";
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 4px;
    background: var(--primary);
    opacity: .72;
    border-radius: 0 0 4px 4px;
    transition: width .3s ease, opacity .3s ease;
  }
  .home-stats .stat:hover::before {
    width: 100%;
    opacity: 1;
  }
  .home-stats .stat-label {
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .3px;
    text-transform: uppercase;
  }
  .home-stats .stat strong {
    color: var(--primary);
    font-size: clamp(28px, 3vw, 38px);
    line-height: 1.2;
    overflow-wrap: anywhere;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }

  /* ==============================================
     SEARCH PANEL — ENHANCED
  ============================================== */
  .search-panel {
    scroll-margin-top: 95px;
    margin-bottom: 30px;
    text-align: center;
    padding: 32px 28px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--surface);
    box-shadow: var(--shadow);
    opacity: 0;
    transform: translateY(20px);
    transition: opacity .6s ease, transform .6s cubic-bezier(.22,1,.36,1);
  }
  .search-panel.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .search-heading {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin: 0 0 14px;
    font-size: clamp(20px, 3vw, 25px);
  }
  .search-heading .heading-icon {
    display: inline-flex;
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    background: var(--primary-soft);
    font-size: 20px;
    transition: transform .3s ease;
  }
  .search-panel:hover .heading-icon {
    transform: rotate(-8deg) scale(1.05);
  }
  .search-description {
    margin: 0 auto 22px;
    max-width: 600px;
    color: var(--muted);
    font-size: 14px;
  }
  .filter-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px;
    max-width: 900px;
    margin: 0 auto;
    text-align: left;
  }
  .filter-grid > div {
    min-width: 0;
  }
  .filter-grid label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
    display: block;
  }
  .filter-grid input,
  .filter-grid select {
    width: 100%;
    min-width: 0;
    padding: 10px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
    transition: border-color .25s ease, box-shadow .25s ease;
  }
  .filter-grid input:focus,
  .filter-grid select:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(7,92,59,.12);
  }
  .search-actions {
    display: flex;
    gap: 9px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 22px;
  }

  /* ==============================================
     BUTTONS — ENHANCED
  ============================================== */
  .home-page .button {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    min-height: 44px;
    padding: 10px 20px;
    border: 1px solid transparent;
    border-radius: 10px;
    background: var(--primary);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    transition: transform .25s cubic-bezier(.22,1,.36,1), background .25s ease, box-shadow .25s ease;
  }
  .home-page .button:hover {
    background: var(--primary-dark);
    color: #fff;
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(7,92,59,.25);
  }
  .home-page .button:active {
    transform: translateY(0);
  }
  .home-page .button.secondary {
    border-color: var(--border);
    background: var(--surface);
    color: var(--text);
  }
  .home-page .button.secondary:hover {
    background: var(--surface-alt);
    color: var(--text);
    box-shadow: 0 4px 12px rgba(0,0,0,.08);
  }
  .home-page .button.small {
    min-height: 36px;
    padding: 8px 14px;
    font-size: 13px;
  }

  /* ==============================================
     REPORTS SECTION — ENHANCED
  ============================================== */
  .reports-section {
    margin-top: 36px;
  }
  .reports-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin: 8px 0 20px;
  }
  .reports-heading h2 {
    margin: 0;
    font-size: clamp(19px, 3vw, 24px);
    font-weight: 700;
  }
  .reports-count {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 32px;
    min-height: 28px;
    padding: 4px 10px;
    margin-left: 8px;
    border-radius: 999px;
    background: var(--primary-soft);
    color: var(--primary);
    border: 1px solid var(--border);
    font-size: 13px;
    font-weight: 700;
    vertical-align: middle;
  }
  .back-to-home-row {
    margin-bottom: 20px;
  }
  .home-page .report-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 20px;
  }
  .home-report-card {
    display: flex;
    flex-direction: column;
    min-width: 0;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: var(--surface);
    box-shadow: var(--shadow);
    opacity: 0;
    transform: translateY(24px);
    transition: opacity .5s ease, transform .5s cubic-bezier(.22,1,.36,1), box-shadow .3s ease;
  }
  .home-report-card.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .home-report-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 16px 36px rgba(0, 50, 30, 0.12);
    border-color: var(--primary);
  }
  .home-report-card .report-image-wrap {
    position: relative;
    overflow: hidden;
    background: var(--surface-alt);
  }
  .home-report-card .report-photo,
  .home-report-card .placeholder-photo {
    display: flex;
    width: 100%;
    height: 190px;
    margin: 0;
    align-items: center;
    justify-content: center;
  }
  .home-report-card .report-photo {
    display: block;
    object-fit: cover;
    cursor: zoom-in;
    transition: transform .5s cubic-bezier(.22,1,.36,1);
  }
  .home-report-card:hover .report-photo {
    transform: scale(1.08);
  }
  .home-report-card .placeholder-photo {
    background: linear-gradient(135deg, var(--primary-soft), var(--surface-alt));
    font-size: 48px;
    transition: transform .5s ease;
  }
  .home-report-card:hover .placeholder-photo span {
    transform: scale(1.15);
    display: inline-block;
  }
  .home-report-card .report-content {
    display: flex;
    flex: 1;
    flex-direction: column;
    min-width: 0;
    padding: 20px;
  }
  .home-report-card .report-content h3 {
    margin: 10px 0 10px;
    line-height: 1.4;
    overflow-wrap: anywhere;
    font-size: 17px;
    font-weight: 700;
    transition: color .25s ease;
  }
  .home-report-card:hover .report-content h3 {
    color: var(--primary);
  }
  .report-meta {
    display: grid;
    gap: 6px;
    margin-top: 5px;
  }
  .report-meta p {
    margin: 2px 0;
    color: var(--muted);
    font-size: 13px;
    overflow-wrap: anywhere;
    display: flex;
    gap: 6px;
    align-items: flex-start;
  }
  .report-meta strong,
  .report-status-row > strong {
    color: var(--text);
    flex-shrink: 0;
  }
  .home-page .tag {
    display: inline-flex;
    align-items: center;
    align-self: flex-start;
    padding: 5px 12px;
    border-radius: 999px;
    background: var(--primary-soft);
    color: var(--primary);
    font-size: 11px;
    font-weight: 800;
    line-height: 1.3;
    letter-spacing: .3px;
    text-transform: uppercase;
  }
  .home-page .tag.found {
    background: #dff4e7;
    color: #176b45;
  }
  .home-page .tag.pending {
    background: #fff1cc;
    color: #805700;
  }
  .home-page .tag.returned {
    background: #e6e9ee;
    color: #465468;
  }
  html[data-theme="dark"] .home-page .tag.found {
    background: #203a2d;
    color: #9be0b6;
  }
  html[data-theme="dark"] .home-page .tag.pending {
    background: #45381c;
    color: #f2d18a;
  }
  html[data-theme="dark"] .home-page .tag.returned {
    background: #303944;
    color: #d2dae5;
  }
  .report-status-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 14px;
    font-size: 12px;
  }
  .home-report-card .card
