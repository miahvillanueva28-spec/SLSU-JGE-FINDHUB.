
{% extends "base.html" %}

{% block title %}Admin Login | SLSU JGE FindHub{% endblock %}

{% block head %}
<style>
    /* Admin Login panel */
    .admin-login-panel {
        width: 100%;
        max-width: 560px;
        margin: 0 auto;
        padding: 28px;

        box-sizing: border-box;
    }

    .admin-login-panel .sticker-row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;

        margin-bottom: 18px;
    }

    .admin-login-panel .sticker {
        display: inline-flex;
        align-items: center;
        gap: 6px;

        padding: 6px 10px;

        border: 1px solid var(--border);
        border-radius: 999px;

        background: var(--surface-alt);
        color: var(--text);

        font-size: 12px;
        font-weight: 600;
    }

    .admin-login-panel h2 {
        margin: 0 0 12px;

        color: var(--text);
        font-size: clamp(22px, 4vw, 28px);
        line-height: 1.3;
    }

    .admin-login-panel .help {
        margin: 0 0 20px;

        color: var(--muted);
        font-size: 14px;
        line-height: 1.7;
    }

    /* Login fields */
    .admin-login-panel form {
        display: flex;
        flex-direction: column;
        width: 100%;
    }

    .admin-login-panel form label {
        margin: 0 0 6px;

        color: var(--text);
        font-size: 13px;
        font-weight: 700;
    }

    .admin-login-panel form input[type="text"],
    .admin-login-panel form input[type="password"],
    .admin-login-panel form input[name="username"] {
        display: block;
        width: 100%;
        min-width: 0;
        min-height: 44px;

        margin: 0 0 14px;
        padding: 10px 12px;

        border: 1px solid var(--border);
        border-radius: 9px;

        background: var(--surface);
        color: var(--text);

        font-family: inherit;
        font-size: 14px;

        box-sizing: border-box;
    }

    /* Both buttons: identical dimensions */
    .admin-login-panel .card-actions {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;

        margin-top: 2px;
    }

    .admin-login-panel .card-actions button[type="submit"],
    .admin-login-panel .card-actions a.button {
        display: inline-flex;
        align-items: center;
        justify-content: center;

        width: 110px;
        min-width: 110px;
        height: 40px;
        min-height: 40px;

        margin: 0;
        padding: 0 10px;

        box-sizing: border-box;
        border: 1px solid var(--primary);
        border-radius: 9px;

        font-family: inherit;
        font-size: 14px;
        font-weight: 700;
        line-height: 1;

        text-align: center;
        text-decoration: none;
        white-space: nowrap;

        cursor: pointer;
    }

    .admin-login-panel .card-actions button[type="submit"] {
        background: var(--primary);
        color: #fff;
    }

    .admin-login-panel .card-actions button[type="submit"]:hover {
        background: var(--primary-dark);
        border-color: var(--primary-dark);
    }

    .admin-login-panel .card-actions a.button.secondary {
        background: var(--surface);
        color: var(--text);
        border-color: var(--border);
    }

    .admin-login-panel .card-actions a.button.secondary:hover {
        background: var(--surface-alt);
        color: var(--text);
    }

    /* Mobile layout */
    @media (max-width: 600px) {
        .admin-login-panel {
            padding: 20px 16px;
        }

        .admin-login-panel .card-actions {
            gap: 8px;
        }

        .admin-login-panel .card-actions button[type="submit"],
        .admin-login-panel .card-actions a.button {
            width: 110px;
            min-width: 110px;
            height: 40px;
            min-height: 40px;
        }
    }
</style>
{% endblock %}

{% block content %}
<section class="panel admin-login-panel">

    <div class="sticker-row">
        <span class="sticker">
            <span aria-hidden="true">🔐</span>
            Admin only
        </span>

        <span class="sticker">
            <span aria-hidden="true">🛠️</span>
            Manage reports
        </span>
    </div>

    <h2>🔐 Administrator Login</h2>

    <p class="help">
        Sign in to review reports, update item statuses, and verify claims.
    </p>

    <form method="POST" action="{{ url_for('admin_login') }}">
        <label for="username">Username</label>

        <input
            id="username"
            name="username"
            type="text"
            autocomplete="username"
            required
        >

        <label for="password">Password</label>

        <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
        >

        <div class="card-actions">
            <button type="submit">Log In</button>

            <a class="button secondary" href="{{ url_for('home') }}">
                Back Home
            </a>
        </div>
    </form>

</section>
{% endblock %}
